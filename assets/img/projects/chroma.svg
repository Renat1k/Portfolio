<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Chroma color system playground interface">
  <defs>
    <linearGradient id="ch-bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#131316"/>
      <stop offset=".6" stop-color="#18161d"/>
      <stop offset="1" stop-color="#1b151c"/>
    </linearGradient>
    <linearGradient id="ch-specimen" x1="116" y1="164" x2="546" y2="634" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8efe2"/>
      <stop offset="1" stop-color="#efdfc9"/>
    </linearGradient>
    <filter id="ch-blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="78"/>
    </filter>
    <filter id="ch-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <clipPath id="ch-window">
      <rect x="80" y="70" width="1040" height="610" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1200" height="750" fill="url(#ch-bg)"/>
  <circle cx="230" cy="650" r="230" fill="#ff8a6b" opacity=".16" filter="url(#ch-blur)"/>
  <circle cx="1010" cy="160" r="240" fill="#a78bfa" opacity=".14" filter="url(#ch-blur)"/>
  <circle cx="900" cy="700" r="220" fill="#7ee0b8" opacity=".1" filter="url(#ch-blur)"/>

  <g filter="url(#ch-shadow)">
    <rect x="80" y="70" width="1040" height="610" rx="24" fill="#1c1c22" stroke="#32323b"/>
  </g>

  <g clip-path="url(#ch-window)" font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <!-- top bar -->
    <circle cx="112" cy="101" r="5.5" fill="#f17f6e"/>
    <circle cx="131" cy="101" r="5.5" fill="#e8b56e"/>
    <circle cx="150" cy="101" r="5.5" fill="#7fc99c"/>

    <path d="M180 94c.9 5.4 3 7.5 8.4 8.4-5.4.9-7.5 3-8.4 8.4-.9-5.4-3-7.5-8.4-8.4 5.4-.9 7.5-3 8.4-8.4Z" fill="#f0c9a2"/>
    <text x="198" y="108" fill="#f0e9df" font-size="16" font-weight="600" letter-spacing="-.3">chroma</text>

    <rect x="354" y="82" width="98" height="38" rx="19" fill="#2a2931" stroke="#3a3943"/>
    <text x="403" y="106" fill="#f5eee5" font-size="12.5" font-weight="500" text-anchor="middle">Palette</text>
    <text x="487" y="106" fill="#817c88" font-size="12.5" text-anchor="middle">Contrast</text>
    <text x="572" y="106" fill="#817c88" font-size="12.5" text-anchor="middle">Tokens</text>

    <rect x="996" y="82" width="88" height="38" rx="19" fill="#f0c9a2"/>
    <text x="1040" y="106" fill="#241a10" font-size="12" font-weight="600" text-anchor="middle">Export</text>

    <line x1="80" y1="132" x2="1120" y2="132" stroke="#2d2d35"/>

    <!-- specimen card -->
    <rect x="116" y="164" width="430" height="470" rx="18" fill="url(#ch-specimen)"/>
    <text x="144" y="202" fill="#a2856b" font-size="10" font-weight="600" letter-spacing="1.7">TYPE SCALE / 01</text>
    <text x="136" y="390" fill="#241d17" font-size="212" font-weight="600" letter-spacing="-14">Aa</text>
    <line x1="144" y1="424" x2="518" y2="424" stroke="#d8c7b1"/>
    <text x="144" y="461" fill="#241d17" font-size="21" font-weight="600" letter-spacing="-.4">Rubik</text>
    <text x="144" y="484" fill="#8b6f55" font-size="12.5">Semibold · 64 / 72</text>

    <rect x="144" y="507" width="174" height="42" rx="10" fill="#241d17"/>
    <text x="164" y="533" fill="#f0c9a2" font-size="12.5" font-family="Consolas, monospace" letter-spacing=".5">#F0C9A2</text>

    <text x="144" y="596" fill="#8b6f55" font-size="13">Aa Bb Cc Dd Ee Ff Gg</text>
    <circle cx="424" cy="590" r="5" fill="#f0c9a2"/>
    <circle cx="444" cy="590" r="5" fill="#d69a63"/>
    <circle cx="464" cy="590" r="5" fill="#b56f42"/>
    <circle cx="484" cy="590" r="5" fill="#6e4a32"/>
    <circle cx="504" cy="590" r="5" fill="#221d19"/>

    <!-- palette heading -->
    <text x="584" y="190" fill="#f4ede2" font-size="23" font-weight="600" letter-spacing="-.5">Warm neutrals</text>
    <text x="584" y="213" fill="#8d8794" font-size="12.5">A soft, editorial palette for long-form reading.</text>
    <text x="1060" y="190" fill="#7d7882" font-size="11" text-anchor="end">6 colors</text>

    <!-- swatches -->
    <g>
      <rect x="584" y="228" width="242" height="132" rx="14" fill="#232329" stroke="#30303a"/>
      <rect x="598" y="242" width="214" height="48" rx="8" fill="#f6efe4"/>
      <text x="598" y="316" fill="#eee7dc" font-size="13.5" font-weight="500">Porcelain</text>
      <text x="812" y="316" fill="#8d8794" font-size="10.5" font-family="Consolas, monospace" text-anchor="end">#F6EFE4</text>
      <text x="598" y="337" fill="#7d7882" font-size="9.5" letter-spacing=".8">AA · 13.1:1</text>

      <rect x="850" y="228" width="242" height="132" rx="14" fill="#232329" stroke="#30303a"/>
      <rect x="864" y="242" width="214" height="48" rx="8" fill="#f0c9a2"/>
      <text x="864" y="316" fill="#eee7dc" font-size="13.5" font-weight="500">Sand</text>
      <text x="1078" y="316" fill="#8d8794" font-size="10.5" font-family="Consolas, monospace" text-anchor="end">#F0C9A2</text>
      <text x="864" y="337" fill="#7d7882" font-size="9.5" letter-spacing=".8">AA · 10.2:1</text>

      <rect x="584" y="376" width="242" height="132" rx="14" fill="#232329" stroke="#30303a"/>
      <rect x="598" y="390" width="214" height="48" rx="8" fill="#d69a63"/>
      <text x="598" y="464" fill="#eee7dc" font-size="13.5" font-weight="500">Clay</text>
      <text x="812" y="464" fill="#8d8794" font-size="10.5" font-family="Consolas, monospace" text-anchor="end">#D69A63</text>
      <text x="598" y="485" fill="#7d7882" font-size="9.5" letter-spacing=".8">AA · 6.4:1</text>

      <rect x="850" y="376" width="242" height="132" rx="14" fill="#232329" stroke="#30303a"/>
      <rect x="864" y="390" width="214" height="48" rx="8" fill="#b56f42"/>
      <text x="864" y="464" fill="#eee7dc" font-size="13.5" font-weight="500">Terracotta</text>
      <text x="1078" y="464" fill="#8d8794" font-size="10.5" font-family="Consolas, monospace" text-anchor="end">#B56F42</text>
      <text x="864" y="485" fill="#7d7882" font-size="9.5" letter-spacing=".8">AA · 4.7:1</text>

      <rect x="584" y="524" width="242" height="132" rx="14" fill="#232329" stroke="#30303a"/>
      <rect x="598" y="538" width="214" height="48" rx="8" fill="#6e4a32"/>
      <text x="598" y="612" fill="#eee7dc" font-size="13.5" font-weight="500">Umber</text>
      <text x="812" y="612" fill="#8d8794" font-size="10.5" font-family="Consolas, monospace" text-anchor="end">#6E4A32</text>
      <text x="598" y="633" fill="#7d7882" font-size="9.5" letter-spacing=".8">AA LARGE · 2.3:1</text>

      <rect x="850" y="524" width="242" height="132" rx="14" fill="#232329" stroke="#30303a"/>
      <rect x="864" y="538" width="214" height="48" rx="8" fill="#221d19" stroke="#3c3c46"/>
      <text x="864" y="612" fill="#eee7dc" font-size="13.5" font-weight="500">Ink</text>
      <text x="1078" y="612" fill="#8d8794" font-size="10.5" font-family="Consolas, monospace" text-anchor="end">#221D19</text>
      <text x="864" y="633" fill="#7d7882" font-size="9.5" letter-spacing=".8">BASE · 15.8:1</text>
    </g>
  </g>
</svg>
